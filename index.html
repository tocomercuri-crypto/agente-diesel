<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agente Diesel — Bicos Common Rail Bosch</title>
<style>
  :root {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface-alt: #e8ece4;
    --primary: #2c5f2d;
    --primary-light: #3a7d3e;
    --text: #1a1a1a;
    --text-sec: #555;
    --text-muted: #888;
    --border: #d4d8cf;
    --user-bg: #2c5f2d;
    --user-fg: #fff;
    --ai-bg: #ffffff;
    --ai-fg: #1a1a1a;
    --err-bg: #fee;
    --err-fg: #c00;
    --err-border: #fcc;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --radius: 14px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111; --surface: #1c1c1e; --surface-alt: #2a2a2c;
      --primary: #4caf50; --primary-light: #66bb6a;
      --text: #e8e8e8; --text-sec: #aaa; --text-muted: #777;
      --border: #333;
      --user-bg: #2e7d32; --user-fg: #fff;
      --ai-bg: #1c1c1e; --ai-fg: #e8e8e8;
      --err-bg: #2a1010; --err-fg: #f88; --err-border: #522;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #111; --surface: #1c1c1e; --surface-alt: #2a2a2c;
    --primary: #4caf50; --primary-light: #66bb6a;
    --text: #e8e8e8; --text-sec: #aaa; --text-muted: #777;
    --border: #333;
    --user-bg: #2e7d32; --user-fg: #fff;
    --ai-bg: #1c1c1e; --ai-fg: #e8e8e8;
    --err-bg: #2a1010; --err-fg: #f88; --err-border: #522;
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { height:100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column;
  }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body::before {
    content:""; position:fixed; inset:0 0 auto;
    height: env(safe-area-inset-top, 0px);
    background:var(--surface); z-index:10;
  }
  header {
    position:sticky; top: env(safe-area-inset-top, 0px);
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:14px 20px; display:flex; align-items:center; gap:12px;
    z-index:5; box-shadow:var(--shadow);
  }
  .logo {
    width:42px; height:42px; background:var(--primary); border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
  }
  .hdr h1 { font-size:16px; font-weight:700; }
  .hdr p { font-size:12px; color:var(--text-muted); }
  .btn-clear {
    margin-left:auto; background:var(--surface-alt); border:1px solid var(--border);
    color:var(--text-sec); font-size:12px; padding:6px 12px; border-radius:8px; cursor:pointer;
  }
  .btn-clear:hover { background:var(--border); }
  #chat {
    flex:1; overflow-y:auto; padding:16px 16px 8px;
    display:flex; flex-direction:column; gap:12px;
  }
  .msg {
    max-width:85%; padding:12px 16px; border-radius:var(--radius);
    line-height:1.55; font-size:15px; word-break:break-word; box-shadow:var(--shadow);
  }
  .msg.user {
    align-self:flex-end; background:var(--user-bg); color:var(--user-fg);
    border-bottom-right-radius:4px; white-space:pre-wrap;
  }
  .msg.ai {
    align-self:flex-start; background:var(--ai-bg); color:var(--ai-fg);
    border:1px solid var(--border); border-bottom-left-radius:4px;
  }
  .msg.ai strong { color:var(--primary); }
  .typing {
    align-self:flex-start; padding:12px 20px; background:var(--ai-bg);
    border:1px solid var(--border); border-radius:var(--radius);
    border-bottom-left-radius:4px; display:none; gap:5px; box-shadow:var(--shadow);
  }
  .typing.on { display:flex; }
  .typing span {
    width:8px; height:8px; background:var(--text-muted); border-radius:50%;
    animation:bounce 1.4s infinite;
  }
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
  .welcome { text-align:center; padding:40px 20px; color:var(--text-sec); }
  .welcome .icon { font-size:48px; margin-bottom:12px; }
  .welcome h2 { font-size:18px; color:var(--text); margin-bottom:8px; }
  .welcome p { font-size:14px; line-height:1.5; }

  .input-area {
    padding:12px 16px; padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; gap:10px; align-items:flex-end;
  }
  #inp {
    flex:1; background:var(--surface-alt); border:1px solid var(--border);
    border-radius:12px; padding:12px 16px; font-size:15px; color:var(--text);
    resize:none; font-family:inherit; min-height:46px; max-height:120px; line-height:1.4;
  }
  #inp::placeholder { color:var(--text-muted); }
  #inp:focus { outline:none; border-color:var(--primary); }
  #btn {
    width:46px; height:46px; background:var(--primary); border:none; border-radius:12px;
    color:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; transition:background .15s;
  }
  #btn:hover { background:var(--primary-light); }
  #btn:disabled { opacity:.5; cursor:not-allowed; }
  .err-msg {
    background:var(--err-bg); color:var(--err-fg); border:1px solid var(--err-border);
    padding:10px 14px; border-radius:10px; font-size:13px;
    align-self:center; max-width:90%; text-align:center;
  }
  .unavail {
    text-align:center; padding:60px 24px; color:var(--text-sec); font-size:15px; line-height:1.6;
  }
  .unavail .icon { font-size:48px; margin-bottom:16px; }
</style>
</head>
<body>

<header>
  <div class="logo">🔧</div>
  <div class="hdr">
    <h1>Agente Diesel</h1>
    <p>Especialista em Bicos Common Rail Bosch</p>
  </div>
  <button class="btn-clear" onclick="clearChat()">Limpar</button>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <div class="icon">⛽</div>
    <h2>Olá! Sou seu assistente técnico.</h2>
    <p>Especializado em regulagem de bicos injetores diesel Common Rail Bosch.<br>
    Pergunte sobre calibração, diagnósticos, valores de referência, procedimentos de teste e mais.</p>
  </div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>
</div>

<div class="input-area">
  <textarea id="inp" rows="1" placeholder="Pergunte sobre bicos injetores..." onkeydown="hKey(event)" oninput="aResize(this)"></textarea>
  <button id="btn" onclick="send()">➤</button>
</div>

<script>
const RULES = `Você é o "Agente Diesel", um técnico especialista em bicos injetores diesel Common Rail, com foco em produtos Bosch. Você tem amplo conhecimento prático e teórico sobre:

SISTEMAS E COMPONENTES:
- Sistemas Common Rail Bosch (CRS1, CRS2, CRS3, CRSN2, CRSN3)
- Famílias de injetores: CRIN1, CRIN2, CRIN3, CRIN3-18, CRIN4 (piezoelétricos)
- Bicos injetores solenoides e piezoelétricos
- Bomba de alta pressão CP1, CP3, CP4
- Rail (tubo distribuidor), sensor de pressão do rail
- Válvulas reguladoras de pressão (DRV) e dosadora (ZME/PCV)

PONTOS BÁSICOS DE REGULAGEM (os 4 pontos que todo bico Common Rail deve ser testado):
1. PLENA CARGA — Injeção principal a carga máxima. É o ponto que simula o motor em potência total. Avalia a capacidade máxima de vazão do injetor. O calço responsável pela regulagem da plena carga é o DNH (calço DNH).
2. CARGA PARCIAL — Injeção em regime intermediário. Simula condições normais de rodagem/uso cotidiano do veículo. O calço responsável pela regulagem da carga parcial é o RLS (calço RLS).
3. MARCHA LENTA — Injeção em rotação de marcha lenta. Fundamental para estabilidade do motor parado/em baixa rotação. O calço responsável pela regulagem da marcha lenta é o DFK (calço DFK).
4. PRÉ-INJEÇÃO — Injeção piloto que antecede a principal. Responsável por reduzir ruído de combustão e emissões. Também chamada de injeção piloto. O calço responsável pela regulagem da pré-injeção é o MFK (calço MFK).
5. CALÇO AH (Gap) — Calço que regula o gap da esfera. Impacta mais a pré-injeção do que o próprio calço MFK. É um calço crítico que deve ser considerado ao ajustar a pré-injeção.
Quando o usuário perguntar sobre regulagem, SEMPRE considere esses 4 pontos como a base de todo teste. Se perguntarem "quais os pontos de regulagem", liste esses 4. Se perguntarem sobre teste de um bico, mencione que ele deve ser verificado nesses 4 pontos.

SITUAÇÕES PRÁTICAS DE REGULAGEM:

SITUAÇÃO 1 — Bico alto de óleo na Plena Carga (demais pontos OK):
- O calço responsável é o DNH.
- Para corrigir, modificar o calço DNH em 50 milésimos.
- ATENÇÃO: se a ponteira (nozzle) do injetor não estiver com o fluxo correto, não adianta aumentar ou diminuir o calço. Primeiro verificar o fluxo da ponteira antes de mexer no calço.

SITUAÇÃO 2 — Bico sem pré-injeção (valor zero):
- Verificar se o calço AH (Gap) está correto.
- Verificar se o calço MFK (pré-injeção) não está muito alto.
- Verificar a amperagem (atracamento) do injetor.
- Injetores CRI1 família 110 Bosch (0 445 110 xxx): amperagem de atracamento entre 10A e 15A. Não pode ultrapassar 15A nem ser abaixo de 10A.
- Para obter boa pré-injeção e boa marcha lenta na família 110, a faixa ideal de trabalho é entre 13,5A e 14,5A.
- Além da amperagem, verificar também a indutância e a resistência da bobina do injetor.

SITUAÇÃO 3 — Marcha lenta muito baixa, mas calço DFK está correto:
- Se o calço está correto e a marcha lenta continua baixa, verificar a indutância da bobina.
- A indutância pode estar muito baixa ou muito alta, causando o problema.

SITUAÇÃO 4 — Carga parcial (RLS) muito baixa / redundância muito alta:
- Causa: altos níveis de óleo, marcha lenta muito alta e emissões elevadas.
- Se o calço RLS estiver muito distante (valor alto demais), acontece o inverso: pouca marcha lenta e pouca carga parcial.

PROCEDIMENTOS TÉCNICOS:
- Testes em bancada (EPS 200, EPS 205, EPS 708, EPS 815, CRI IFT)
- Teste de estanqueidade / retorno (back leak)
- Teste de vazão (volume de injeção em mm³ por curso)
- Teste de spray (padrão de pulverização e atomização)
- Valores de referência de vazão, pressão e retorno por modelo
- Códigos IMA / C2I / C3I (códigos de calibração individual do injetor)
- Desmontagem, limpeza ultrassônica, montagem
- Torques de aperto específicos por modelo
- Substituição de componentes internos (nozzle/ponta, válvula solenoide, mola, shims)

DIAGNÓSTICO:
- Códigos de falha (DTC) relacionados a injetores
- Diagnóstico por scanner (valores de correção de injeção, quantidades de injeção piloto/principal/pós)
- Análise de excesso de retorno e suas causas
- Problemas comuns: marcha lenta instável, fumaça, perda de potência, batida de bico, dificuldade de partida a frio
- Relação entre sintomas do motor e falhas no injetor

REFERÊNCIAS E PART NUMBERS:
- Nomenclatura Bosch (0 445 110 xxx, 0 445 120 xxx, etc.)
- Cross-reference com aplicações por veículo/motor
- Kits de reparo e componentes de reposição

DADOS DE INJETORES CADASTRADOS:

Injetor 0 445 110 141:
- Veículo: Renault Master
- Anos: 2005 a 2011
- Indutância: 190 a 220 mH
- Família: CRI1 família 110

Injetor 0 445 110 231:
- Indutância: 190 a 220 mH
- Família: CRI1 família 110

Injetor 0 445 110 265:
- Veículo: Renault Master
- Anos: 2011 a 2012
- Indutância: 190 a 220 mH
- Família: CRI1 família 110

REGRAS:
1. Responda SEMPRE em português brasileiro, de forma clara e técnica.
2. Quando citar valores (pressão, vazão, torque), especifique unidades (bar, mm³/curso, Nm).
3. Se não tiver certeza de um valor exato, diga claramente e sugira consultar o manual técnico ou catálogo Bosch.
4. Sempre priorize a SEGURANÇA — alerte sobre pressões perigosas (Common Rail trabalha com 200 a 2500 bar).
5. Seja DIRETO — responda apenas o que foi perguntado, sem adicionar dicas práticas, sugestões extras ou conselhos não solicitados no final.
6. Se a pergunta não for sobre bicos/injetores diesel, diga educadamente que sua especialidade é essa área.
7. Use formatação simples para organizar a resposta quando necessário.
8. NÃO adicione seções tipo "dicas", "na prática", "como trabalhar na bancada" ou qualquer complemento que o usuário não pediu.`;

let sample = null;
let turns = [];
let busy = false;

async function init() {
  if (typeof window.claude === 'undefined') {
    showUnavail(); return;
  }
  try {
    sample = await claude.use("sample");
  } catch(e) { /* null */ }
  if (!sample) showUnavail();
}

function showUnavail() {
  const w = document.getElementById('welcome');
  if (w) w.innerHTML = '<div class="icon">⚠️</div><h2>Recurso indisponível</h2><p>Este agente precisa ser aberto dentro do Claude para funcionar.<br>Abra o link pelo claude.ai.</p>';
  document.querySelector('.input-area').style.display = 'none';
}

function aResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function hKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

function fmt(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function addMsg(role, text) {
  const w = document.getElementById('welcome');
  if (w) w.remove();
  const chat = document.getElementById('chat');
  const typ = document.getElementById('typing');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  if (role === 'user') div.textContent = text;
  else div.innerHTML = fmt(text);
  chat.insertBefore(div, typ);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function showErr(msg) {
  const chat = document.getElementById('chat');
  const typ = document.getElementById('typing');
  const div = document.createElement('div');
  div.className = 'err-msg';
  div.textContent = msg;
  chat.insertBefore(div, typ);
  chat.scrollTop = chat.scrollHeight;
}

function clearChat() {
  turns = [];
  const chat = document.getElementById('chat');
  chat.querySelectorAll('.msg,.err-msg').forEach(el => el.remove());
  const typ = document.getElementById('typing');
  const w = document.createElement('div');
  w.className = 'welcome'; w.id = 'welcome';
  w.innerHTML = `<div class="icon">⛽</div>
    <h2>Olá! Sou seu assistente técnico.</h2>
    <p>Especializado em regulagem de bicos injetores diesel Common Rail Bosch.<br>
    Pergunte sobre calibração, diagnósticos, valores de referência, procedimentos de teste e mais.</p>
`;
  chat.insertBefore(w, typ);
}

async function send() {
  if (busy || !sample) return;
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = 'auto';

  addMsg('user', text);
  turns.push({ role: 'user', content: text });

  busy = true;
  document.getElementById('btn').disabled = true;
  document.getElementById('typing').classList.add('on');

  const bubble = addMsg('ai', '');
  bubble.style.display = 'none';

  const ctl = new AbortController();

  try {
    const msgs = [{ role: 'user', content: RULES }, ...turns.slice(-20)];
    const { text: reply } = await sample(msgs, {
      cache: false,
      signal: ctl.signal,
      onText: ({ text }) => {
        document.getElementById('typing').classList.remove('on');
        bubble.style.display = '';
        bubble.innerHTML = fmt(text);
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
      }
    });
    turns.push({ role: 'assistant', content: reply });
  } catch(e) {
    document.getElementById('typing').classList.remove('on');
    if (e.text) {
      bubble.style.display = '';
      bubble.innerHTML = fmt(e.text);
      turns.push({ role: 'assistant', content: e.text });
    } else {
      bubble.remove();
      turns.pop();
      const errMap = {
        not_granted: 'Permissão negada. Reabra a página e permita o uso do Claude.',
        rate_limited: 'Muitas perguntas seguidas. Aguarde um momento e tente de novo.',
        session_expired: 'Sessão expirada. Faça login novamente no Claude.',
        refused: 'O Claude não pôde responder a essa pergunta. Tente reformular.',
      };
      showErr(errMap[e.code] || 'Erro ao conectar. Tente novamente.');
    }
  } finally {
    busy = false;
    document.getElementById('btn').disabled = false;
    document.getElementById('typing').classList.remove('on');
    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
  }
}

init();
</script>
</body>
</html>
